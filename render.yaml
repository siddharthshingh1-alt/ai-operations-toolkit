# Render blueprint for the API (CLAUDE.md Section 3a — deployment is non-optional).
#
# Render reads this when you create a Blueprint instance, so the service is
# configured from version control rather than by hand in a dashboard. The only
# things you enter manually are the two secrets, which is deliberate: values
# marked `sync: false` are never written into the repository.
#
# The web app deploys separately to Vercel — see DEPLOYMENT.md.

services:
  - type: web
    name: aiops-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    # Built from the repository root so the shared packages resolve.
    dockerContext: .
    plan: free
    region: singapore
    branch: main

    # Render restarts the service if this stops returning 200. It is the
    # liveness probe, which never touches the database — a readiness failure
    # should not cause a restart loop.
    healthCheckPath: /health

    envVars:
      # ---- entered by you in the Render dashboard, never stored in git ----
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      # The live AI key. `sync: false` keeps it out of the repository — it is
      # typed into Render's dashboard and only ever exists in the API's own
      # process. It is never sent to the browser: the web app calls this API
      # from its server, and `Settings.redacted()` is an allowlist that cannot
      # serialise a key even by mistake.
      - key: GOOGLE_API_KEY
        sync: false

      # ---- safe to keep in version control ----

      # The public demo runs LIVE, not from recordings (CLAUDE.md Section 3b).
      #
      # The trade this accepts: a real key sits on the server and a visitor's
      # request spends real quota. The trade it buys: a visitor can type their
      # own question and get a real answer, which is the thing the portfolio is
      # actually claiming to be able to do. On a free tier with no billing
      # attached the downside is bounded — the quota runs out and the app says
      # so in plain language — where the downside of a recordings-only demo is
      # that the central claim is never demonstrated to anyone.
      #
      # The recordings remain in the repository and are one setting away:
      # DEMO_MODE=true replays them, which is what local development and CI use.
      - key: DEMO_MODE
        value: "false"
      - key: ALLOW_BRING_YOUR_OWN_KEY
        value: "true"

      - key: AI_PROVIDER
        value: gemini
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_EMBEDDING_DIMENSIONS
        value: "1536"

      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO

      # The tables already exist in Supabase; do not recreate them on boot.
      - key: DB_AUTO_CREATE
        value: "false"

      - key: AUTH_MODE
        value: demo
      - key: EMAIL_PROVIDER
        value: mock
      - key: CALENDAR_PROVIDER
        value: mock
      - key: BOOKING_PROVIDER
        value: mock
