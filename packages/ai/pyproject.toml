[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-ai"
version = "0.1.0"
description = "Provider-agnostic AI layer: text, structured output, embeddings, transcription, cost tracking, and Demo Mode replay."
requires-python = ">=3.12"
dependencies = [
    "aiops-config",
    "aiops-utils",
    "pydantic>=2.8",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
]

[tool.setuptools]
packages = ["aiops_ai", "aiops_ai.providers"]
