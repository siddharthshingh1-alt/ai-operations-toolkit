[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-tracker"
version = "0.1.0"
description = "Project 5 — AI Project Tracker: projects, tasks, dependencies and an explained health assessment (CLAUDE.md Section 13)."
requires-python = ">=3.12"
dependencies = [
    "aiops-config",
    "aiops-utils",
    "aiops-ai",
    "aiops-db",
    "aiops-docproc",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
]

[tool.setuptools]
packages = ["aiops_tracker"]
