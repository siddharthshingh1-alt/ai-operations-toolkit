[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-builder"
version = "0.1.0"
description = "Project 4 — AI Workflow Builder: the visual editor on top of the shared workflow engine (CLAUDE.md Section 12)."
requires-python = ">=3.12"
dependencies = [
    "aiops-config",
    "aiops-utils",
    "aiops-ai",
    "aiops-db",
    "aiops-adapters",
    "aiops-workflow",
    "aiops-travelops",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
]

[tool.setuptools]
packages = ["aiops_builder"]
