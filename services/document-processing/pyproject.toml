[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-docproc"
version = "0.1.0"
description = "Shared document export (Markdown, HTML, PDF). Built once and consumed by the SOP Generator and Report Generator."
requires-python = ">=3.12"
dependencies = [
    "aiops-config",
    "aiops-utils",
    "pydantic>=2.8",
    # Text extraction from uploaded documents (CLAUDE.md Section 3).
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # Spreadsheet reading for the Dashboard (Project 3) and Report Generator
    # (Project 7). openpyxl is what pandas uses for .xlsx.
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# WeasyPrint needs native GTK/Pango libraries that are not present on a stock
# Windows machine, so it is not a hard dependency. `pip install .[pdf]` after
# installing GTK enables PDF export; without it, Markdown and HTML still work.
pdf = ["weasyprint>=62"]

[tool.setuptools]
packages = ["aiops_docproc"]
